<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An astronomy quiz written by an AI agent that checks every answer against the pages it read."
    />
    <title>Cosmic Quiz</title>
    <meta name="theme-color" content="#021a3d" />
    <!-- The first scene, at the width the screen needs (src/slideshow.ts: SCENES[0], SCENE_SIZES). -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/scenes/observatory-v1-1280.webp 1280w, /scenes/observatory-v1-1920.webp 1920w, /scenes/observatory-v1-2560.webp 2560w"
      imagesizes="(max-aspect-ratio: 4/3) 100vw, (max-aspect-ratio: 85/48) 178vh, 100vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Press+Start+2P&family=Space+Grotesk:wght@700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
