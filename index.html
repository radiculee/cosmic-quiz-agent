<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An astronomy quiz written by an AI agent that checks every answer against the pages it read."
    />
    <title>Cosmic Quiz</title>
    <!-- The link preview (public/og-v1.jpg, 1200 x 630), on the site's own domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cosmic Quiz" />
    <meta property="og:title" content="Cosmic Quiz" />
    <meta property="og:description" content="An astronomy quiz written by an AI agent that checks every answer against the pages it read." />
    <meta property="og:url" content="https://cosmic.vedantgaikwad.ie/" />
    <meta property="og:image" content="https://cosmic.vedantgaikwad.ie/og-v1.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="COSMIC QUIZ and the tagline over a white observatory in a pink grass field under a navy sky" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cosmic Quiz" />
    <meta name="twitter:description" content="An astronomy quiz written by an AI agent that checks every answer against the pages it read." />
    <meta name="twitter:image" content="https://cosmic.vedantgaikwad.ie/og-v1.jpg" />
    <meta name="theme-color" content="#021a3d" />
    <!-- The first scene, at the width the screen needs (src/slideshow.ts: SCENES[0], SCENE_SIZES). -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/scenes/observatory-v1-1280.webp 1280w, /scenes/observatory-v1-1920.webp 1920w, /scenes/observatory-v1-2560.webp 2560w"
      imagesizes="(max-aspect-ratio: 4/3) 100vw, (max-aspect-ratio: 85/48) 178vh, 100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
