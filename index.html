<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The double-brace brand tokens are filled from src/brand.ts by the brand-html plugin in vite.config.ts. -->
    <title>{{brand.title}}</title>
    <meta name="description" content="{{brand.description}}" />
    <meta name="application-name" content="{{brand.name}}" />
    <meta name="theme-color" content="{{brand.themeColor}}" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The link preview (1200 x 630), on the site's own domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{brand.name}}" />
    <meta property="og:title" content="{{brand.title}}" />
    <meta property="og:description" content="{{brand.description}}" />
    <meta property="og:url" content="{{brand.origin}}/" />
    <meta property="og:image" content="{{brand.origin}}{{brand.socialImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{brand.socialImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{brand.title}}" />
    <meta name="twitter:description" content="{{brand.description}}" />
    <meta name="twitter:image" content="{{brand.origin}}{{brand.socialImage}}" />
    <!-- The first scene, at the width the screen needs (src/slideshow.ts: SCENES[0], SCENE_SIZES). -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/scenes/observatory-v1-1280.webp 1280w, /scenes/observatory-v1-1920.webp 1920w, /scenes/observatory-v1-2560.webp 2560w"
      imagesizes="(max-aspect-ratio: 4/3) 100vw, (max-aspect-ratio: 85/48) 178vh, 100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
