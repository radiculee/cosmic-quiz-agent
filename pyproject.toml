[project]
name = "cosmic-quiz-agent"
version = "0.1.0"
description = "An autonomous astronomy research agent behind a Learn / Quiz game."
requires-python = ">=3.12"
# Runtime dependencies, pinned. Vercel installs these (it reads pyproject.toml before
# requirements.txt); pip installs the same pins from requirements.txt, for the Curator workflow
# and local setup. tests/test_packaging.py fails if the two lists ever differ. Dev tools are
# pinned in requirements-dev.txt.
dependencies = [
    "anthropic==1.11.0",
    "httpx2==2.13.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "typesafe-sdk==0.7.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agent", "api", "curator", "dev", "evals", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
