[project]
name = "cosmic-quiz-agent"
version = "0.1.0"
description = "An autonomous astronomy research agent behind a Learn / Quiz game."
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt (Vercel reads that file);
# dev tools are pinned in requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agent", "api", "curator", "dev", "evals", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
