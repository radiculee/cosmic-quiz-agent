# The Curator, on a schedule (python -m curator, see curator/__main__.py).
#
# Every day at 06:17 UTC, after the previous day's NASA and ESA news and away from GitHub's busy
# top of the hour. From DAILY_FROM it runs `daily` (about $0.17 on Anthropic, capped at $0.40);
# before that, and whenever chosen by hand, it runs `upkeep`, which is free. Either way the bank
# gets a request every day, so Supabase's free tier never pauses it for inactivity.
#
# Runs the bank could not store wait on disk in runs/curator/pending/ and are sent by the next
# run; the cache below carries that folder from one run to the next.

name: Curator

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "daily (paid: about $0.17, capped at $0.40) or upkeep (free)"
        type: choice
        options: [daily, upkeep]
        default: daily

# One Curator at a time, and a queued one waits instead of cancelling a run that is spending.
concurrency:
  group: curator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  curator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Paid daily runs start on this date (UTC): October's budget is spent on the bank build.
      DAILY_FROM: "2026-11-01"
    steps:
      # Actions are pinned to release commits, since this job holds API keys.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runs left over from an earlier run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runs/curator/pending
          key: curator-pending-${{ github.run_id }}
          restore-keys: curator-pending-

      - name: Choose today's command
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          CHOSEN: ${{ inputs.command }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            command="$CHOSEN"
          elif [ "$(date -u +%F)" \< "$DAILY_FROM" ]; then
            command="upkeep"
          else
            command="daily"
          fi
          echo "Running: $command"
          echo "command=$command" >> "$GITHUB_OUTPUT"

      - name: Run the Curator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COMMAND: ${{ steps.choose.outputs.command }}
        run: |
          if [ "$COMMAND" = "daily" ]; then
            python -m curator daily --yes
          else
            python -m curator upkeep
          fi

      - name: Keep runs that could not be stored for the next run
        if: always()
        run: mkdir -p runs/curator/pending

      - name: Save them
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runs/curator/pending
          key: curator-pending-${{ github.run_id }}
